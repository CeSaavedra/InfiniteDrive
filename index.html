<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infinite Drive</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
</head>

<body>
  <main>
    <div id="container3D"></div>
    <div id="startOverlay">
      <div class="menu__nav_container">
        <div class="menu__nav">

          <!-- PLAY GAME MENU -->
          <div class="menu__play roboto-flex-semibold"
            style="display: flex; flex-direction: column; align-items: center;">
            <button class="back-btn roboto-flex-semibold" id="playBackBtn">← BACK</button>

            <div class="menu__play_text_container">
              <p class="menu__text roboto-flex-semibold">PAINT YOUR RIDE</p>
            </div>

            <div class="menu__play_color_container">
              <div class="menu__play_color">

                <!-- COLOR OPTIONS -->
                <div class="color-picker">
                  <div class="color-picker-row-1">
                    <button class="color-circle" data-color="#790808" style="color:#ec0000"></button>
                    <button class="color-circle" data-color="#ff3300" style="color:#ff8c00"></button>
                    <button class="color-circle" data-color="#ff6600" style="color:#ffe100"></button>
                    <button class="color-circle" data-color="#4f8100" style="color:#98ff37"></button>
                    <button class="color-circle" data-color="#dbdbdb" style="color:#ffffff"></button>
                  </div>
                  <div class="color-picker-row-2">
                    <button class="color-circle" data-color="#0039bf" style="color:#4c82ff"></button>
                    <button class="color-circle" data-color="#4907ff" style="color:#a826ff"></button>
                    <button class="color-circle" data-color="#ff1dce" style="color:#ff71e0"></button>
                    <button class="color-circle" data-color="rainbow" style="background: conic-gradient(red, orange, yellow, green, blue, violet, red);"></button>
                    <button class="color-circle" data-color="#161616" style="color:#161616"></button>
                  </div>
                </div>
              </div>
            </div>

            <!-- START GAME BUTTON -->
            <div class="menu__play_start_container">
              <button id="startBtn">Start Game</button>
            </div>
          </div>


          <!-- HOW TO PLAY MENU -->
          <div class="menu__instructions roboto-flex-semibold">
            <button class="back-btn roboto-flex-semibold" id="instrBackBtn">← BACK</button>

            <div class="menu__instructions_title_container">
              <p class="menu__text">HOW TO PLAY</p>
            </div>

            <div class="menu__instructions_controls_container">
              <ul class="menu__instructions_controls" role="list" aria-label="Game controls">
                <li>
                  <span class="key" aria-hidden="true">W</span>
                  <span class="desc">Accelerate</span>
                </li>
                <li>
                  <span class="key" aria-hidden="true">A</span>
                  <span class="desc">Shift Left</span>
                </li>
                <li>
                  <span class="key" aria-hidden="true">S</span>
                  <span class="desc">Brake</span>
                </li>
                <li>
                  <span class="key" aria-hidden="true">D</span>
                  <span class="desc">Shift Right</span>
                </li>
                <li>
                  <span class="key" aria-hidden="true">M</span>
                  <span class="desc">Mute / Unmute</span>
                </li>
                <li>
                  <span class="key" aria-hidden="true">P</span>
                  <span class="desc">Pause / Unpause</span>
                </li>
              </ul>
            </div>
          </div>

          <!-- MAIN MENU -->
          <ul class="menu__options roboto-flex-semibold">
            <li>
              <button type="button" class="menu__option" id="playGameBtn">
                PLAY GAME
              </button>
            </li>
            <li>
              <button type="button" class="menu__option" id="howToPlayBtn">
                HOW TO PLAY
              </button>
            </li>
          </ul>
        </div>
      </div>
      <div class="menu__empty"></div>
    </div>


    <!-- IN-GAME HUD -->
    <div id="hud" style="display: none;">
      <div id="scoreDisplay">Score: 0 mi</div>
      <div id="speedDisplayWrapper" style="position: relative;">
        <div id="speedDisplay">Speed: 0 km/h</div>
      </div>
    </div>

    <!-- SETTINGS HUD -->
    <div id="settingsOverlay" style="display: none;">

      <button id="pauseBtn" class="settingsBtn">
        <img src="assets/icons/pause.svg" alt="" class="settings-icon-pause" id="icon-pause" />
        <img src="assets/icons/play.svg" alt="Play" id="icon-play" class="settings-icon-pause" style="display: none;" />
      </button>

      <button id="muteBtn" class="settingsBtn">
        <img src="assets/icons/unmuted.svg" alt="Unmuted" id="icon-unmuted" class="settings-icon-audio" />
        <img src="assets/icons/muted.svg" alt="Muted" id="icon-muted" class="settings-icon-audio"
          style="display: none;" />
      </button>

    </div>

    <!-- END GAME UI -->
    <div id="gameOverOverlay">
      <div id="wastedText">WASTED</div>
      <div id="finalScore">Score: 0</div>
      <button id="retryBtn">RETRY</button>
    </div>


    <div id="loading-screen" style="position:fixed; inset:0; background:#101010; z-index:9999; display:flex; align-items:center; justify-content:center; color:#d5d5d5; font-size:1rem;">
      Loading...
    </div>

  </main>
  <script type="module" src="./js/main.js"></script>
</body>

</html>
